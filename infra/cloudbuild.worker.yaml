## Builds the long-running BullMQ worker and deploys it as a Cloud Run worker
## pool. This configuration intentionally does NOT run Prisma migrations; run
## them once from the web/deployment pipeline.

substitutions:
  # Set these values once for the environment that owns this trigger.
  _REGION: "REPLACE_WITH_GCP_REGION"
  _AR_REPOSITORY: "REPLACE_WITH_ARTIFACT_REGISTRY_REPOSITORY"
  _WORKER_POOL: "openinstadm-worker"
  _WORKER_SERVICE_ACCOUNT: "REPLACE_WITH_WORKER_RUNTIME_SERVICE_ACCOUNT"
  _WEB_BASE_URL: "https://REPLACE_WITH_YOUR_WEB_APP_DOMAIN"

  # The secrets must already exist in Secret Manager. Pin a numeric version in
  # production and update it here deliberately when rotating a secret.
  _SECRET_VERSION: "1"
  _DATABASE_URL_SECRET: "openinstadm-database-url"
  _REDIS_URL_SECRET: "openinstadm-redis-url"
  _ENCRYPTION_KEY_SECRET: "openinstadm-encryption-key"

  # Optional worker tuning. These are the current application defaults.
  _META_GRAPH_API_VERSION: "v26.0"
  _COMMENT_POLL_INTERVAL_MS: "300000"
  _COMMENT_POLL_LOOKBACK_HOURS: "72"
  _COMMENT_POLL_MAX_PER_SWEEP: "30"

steps:
  - id: build-worker-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=infra/docker/dockerfile.worker
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/openinstadm-worker:$COMMIT_SHA
      - .

  - id: push-worker-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/openinstadm-worker:$COMMIT_SHA

  - id: deploy-worker-pool
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - worker-pools
      - deploy
      - ${_WORKER_POOL}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/openinstadm-worker:$COMMIT_SHA
      - --service-account=${_WORKER_SERVICE_ACCOUNT}
      # A worker pool does not autoscale. One instance keeps this BullMQ
      # consumer and its polling reconciler running continuously.
      - --instances=1
      - --cpu=1
      - --memory=512Mi
      - --update-env-vars=NEXTAUTH_URL=${_WEB_BASE_URL},META_GRAPH_API_VERSION=${_META_GRAPH_API_VERSION},COMMENT_POLL_INTERVAL_MS=${_COMMENT_POLL_INTERVAL_MS},COMMENT_POLL_LOOKBACK_HOURS=${_COMMENT_POLL_LOOKBACK_HOURS},COMMENT_POLL_MAX_PER_SWEEP=${_COMMENT_POLL_MAX_PER_SWEEP}
      - >-
        --update-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:${_SECRET_VERSION},REDIS_URL=${_REDIS_URL_SECRET}:${_SECRET_VERSION},ENCRYPTION_KEY=${_ENCRYPTION_KEY_SECRET}:${_SECRET_VERSION}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/openinstadm-worker:$COMMIT_SHA
