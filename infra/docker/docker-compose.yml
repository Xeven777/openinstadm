# OpenInstaDM — Local Development Services
# Run from the repository root: docker compose -f infra/docker/docker-compose.yml up -d
#
# Postgres only: jobs run on Trigger.dev and rate-limit/budget counters live in
# Postgres, so there is no Redis (or any other local service) to start.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: openinstadm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
